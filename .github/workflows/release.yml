name: Release

# Publishing a GitHub release `vX.Y.Z` publishes that commit to npm.
# Auth is npm trusted publishing (OIDC): no NPM_TOKEN secret exists. npmjs.com trusts
# only this repository + this workflow file + the `npm-publish` environment.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag matches package.json and is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$TAG" = "v$version" || { echo "Tag $TAG does not match package.json version $version"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "Tag $TAG is not on main"; exit 1; }

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Update npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@11.17.0
      - run: corepack enable
      - run: yarn install --immutable

      - run: yarn generate
      - run: yarn test
      - run: yarn lint
      - run: yarn build

      # The gate above already ran; skip lifecycle scripts so `prepare`/`prepublishOnly`
      # do not rebuild dist/ between verification and upload.
      - run: npm publish --provenance --access public --ignore-scripts
