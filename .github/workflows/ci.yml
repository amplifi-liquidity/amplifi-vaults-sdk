name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      # A transitive dependency (ethereumjs-abi) is locked to a git+ssh URL; fetch it over HTTPS.
      - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: yarn install --immutable
      # Same gate as prepublishOnly, so a green PR is publishable.
      - run: yarn generate
      - run: yarn test
      - run: yarn lint
      - run: yarn build
